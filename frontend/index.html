<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI agent that researches your target company and builds a complete interview prep kit from your resume and JD." />
    <title>InstantInterviewPrep</title>
    <script>
      // apply the saved theme before first paint (avoids a light/dark flash)
      try {
        var t = localStorage.getItem('iip-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
